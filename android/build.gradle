buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    configurations.all {
        resolutionStrategy.dependencySubstitution {
            // The me.carda JitPack artifacts now require an access token (401).
            // The same Awesome Notifications Android core is publicly available
            // under its GitHub coordinate on JitPack.
            substitute module('me.carda:AndroidAwnCore') using module('com.github.rafaelsetragni:AndroidAwnCore:0.8.3') because 'me.carda:AndroidAwnCore is no longer publicly resolvable from JitPack'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
